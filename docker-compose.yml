# JobSync for one person on a home server. Values come from .env next to
# this file; see .env.example and the Deployment section of the README.
services:
  app:
    build:
      context: .
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env}
    image: jobsync:local
    container_name: jobsync
    # Localhost only: tailscale serve (or another proxy) is the way in.
    ports:
      - "127.0.0.1:${JOBSYNC_PORT:-3737}:3737"
    environment:
      - DATABASE_URL=file:/data/jobsync.db
      - DATA_DIR=/data
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET:-}
      - MCP_ENABLED=true
      - BACKUP_TOKEN=${BACKUP_TOKEN:-}
      - TZ=${TZ:-Asia/Singapore}
    volumes:
      - ${JOBSYNC_DATA:-./jobsync-data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3737/signin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
